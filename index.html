<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Search App</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <div class="main-layout">

    <div class="filter-container">
        <h3>Filters</h3>
        <label for="genre">Search by Genre:</label>
        <select id="genre" name="genre">
    <option value="">--Select Genre--</option> <option value="Action">Action</option>
    <option value="Adventure">Adventure</option>
    <option value="Animation">Animation</option>
    <option value="Comedy">Comedy</option>
    <option value="Crime">Crime</option>
    <option value="Documentary">Documentary</option>
    <option value="Drama">Drama</option> <option value="Family">Family</option>
    <option value="Fantasy">Fantasy</option>
    <option value="History">History</option>
    <option value="Horror">Horror</option>
    <option value="Music">Music</option>
    <option value="Mystery">Mystery</option>
    <option value="Romance">Romance</option>
    <option value="Science Fiction">Science Fiction</option> <option value="TV Movie">TV Movie</option>
    <option value="Thriller">Thriller</option>
    <option value="War">War</option>
    <option value="Western">Western</option>
</select>
        <label for="year">Release Year:</label>
        <select id="year">
        <option value="">--Select Year--</option>
        <!-- JavaScript will populate this -->
        </select>
    </div>

    <div class="app-container">
      <h1>🎬 Movie Search</h1>

      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search for a movie..." />
        <button id="search-button">Search</button>
      </div>

      <div id="movie-results" class="results"></div>
    </div>

  </div><script src="script.js"></script>
</body>
</html>
